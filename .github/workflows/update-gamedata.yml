name: Update game data (splat3-data)

on:
  schedule:
    - cron: "23 4 1 * *"  # monthly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/import_gamedata.py
      - name: Commit data
        run: |
          git config user.name "splatgpt-bot"
          git config user.email "splatgpt-bot@users.noreply.github.com"
          git add data/Splatoon3/weapon_stats.json data/Splatoon3/kits.json data/Splatoon3/salmonids.json data/Splatoon3/gear.json data/Splatoon3/abilities.json
          git diff --staged --quiet || git commit -m "🦑 refresh mined game data (splat3-data)"
          git push
